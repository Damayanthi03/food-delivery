[project]
name = "quickbite-qa"
version = "0.1.0"
description = "Isolated browser tests for the existing QuickBite Flask application"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3,<4",
    "playwright>=1.50,<2",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
